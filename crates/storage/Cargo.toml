[package]
name = "storage"
version = "0.1.0"
edition = "2021"

[dependencies]
parser = { path = "../parser" }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "rt", "time"] }
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
