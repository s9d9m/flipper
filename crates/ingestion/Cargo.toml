[package]
name = "ingestion"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
diff = { path = "../diff" }
parser = { path = "../parser" }
storage = { path = "../storage" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"

[dev-dependencies]
wiremock = "0.5"

[[bin]]
name = "ingestion-service"
path = "src/main.rs"
